apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: vllm
  namespaceSelector:
    matchNames:
      - default
  endpoints:
  - port: http
    interval: 15s
    path: /metrics